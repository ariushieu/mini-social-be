# ==========================================================
# CD - Build, Push & Deploy (Spring Boot + Maven)
# Project: mini-social-be
# ==========================================================

name: CD - Deploy to VPS

on:
  push:
    branches:
      - master  # Thay thành 'main' nếu ông đã đổi tên nhánh chính
    paths-ignore:
      - "**/*.md"
      - ".env.example"
      - "docs/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build with Maven
        run: mvn clean package -DskipTests

      # --- Docker Build & Push ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            qhieu05/mini-social-be:latest
            qhieu05/mini-social-be:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Deploy to VPS ---
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu

            # Truy cập thư mục dự án
            cd ~/vps-config/projects/mini-social-be

            # Kéo bản cập nhật mới nhất từ Docker Hub
            docker compose pull app

            # Chỉ recreate app, không restart MySQL
            docker compose up -d --no-deps --force-recreate app

      - name: Health check
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu

            # Chờ 20 giây để Spring Boot khởi động hoàn tất
            sleep 20

            # Kiểm tra trạng thái container và fail workflow nếu app không chạy
            status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' mini-social-be-app)
            echo "Container status: $status"
            if [ "$status" != "healthy" ] && [ "$status" != "running" ]; then
              docker logs --tail=100 mini-social-be-app
              exit 1
            fi

      # --- Cleanup ---
      - name: Clean up old Docker images
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Xóa các Image cũ không còn sử dụng để tiết kiệm bộ nhớ VPS
            docker image prune -af --filter "until=48h"